name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the Create release step to publish releases/tags.
permissions:
  contents: write

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
# Tags/branches are distinct refs, so release builds are never cancelled by a
# branch build and vice-versa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OF_VERSION: "0.12.0"

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout DuneBox
        uses: actions/checkout@v5
        with:
          path: project
          lfs: true

      - name: Cache OpenFrameworks
        id: cache-of
        uses: actions/cache@v5
        with:
          path: openFrameworks
          key: of-${{ env.OF_VERSION }}-win-vs

      - name: Download OpenFrameworks
        if: steps.cache-of.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $url = "https://github.com/openframeworks/openFrameworks/releases/download/${{ env.OF_VERSION }}/of_v${{ env.OF_VERSION }}_vs_release.zip"
          Invoke-WebRequest -Uri $url -OutFile of.zip -UseBasicParsing
          Expand-Archive -Path of.zip -DestinationPath of_temp
          $dir = Get-ChildItem of_temp -Directory | Select-Object -First 1
          Move-Item $dir.FullName openFrameworks
          Remove-Item of_temp -Recurse -Force
          Remove-Item of.zip

      - name: Install addons
        shell: bash
        run: |
          set -e
          cd openFrameworks/addons
          # These four community addons live inside the cached OF tree, so wipe and
          # re-clone for a deterministic state (a cache hit may hold older versions).
          rm -rf ofxCv ofxDatGui ofxParagraph ofxModal ofxKinectForWindows2
          # Pin every addon to a specific commit for reproducible builds (the app
          # depends on specific addon APIs; floating HEAD could break CI silently).
          clone_pin() { git clone -q "https://github.com/$1" "$2" && git -C "$2" checkout -q "$3"; }
          clone_pin kylemcdonald/ofxCv        ofxCv        209a3986a8f8e1928c7a11f6e1c5d8ea5406e639
          clone_pin braitsch/ofxParagraph     ofxParagraph 41dbfd2e07e00e358629d470dd1b6f986dee2b70
          clone_pin braitsch/ofxModal         ofxModal     71bfaa283407bbe58b921fd581d8665f21cf5eb8
          # ofxKinectForWindows2: native Kinect v2 backend (Microsoft Kinect SDK
          # 2.0). This commit ("0.12.1 fix") is OF-0.12 compatible. Only the
          # Windows build links it (see the addons.make append below).
          clone_pin elliotwoods/ofxKinectForWindows2 ofxKinectForWindows2 ce6e3a9248549a8e9bdf1de77bc00959c6b718a5
          # ofxDatGui: the thomwolf fork matches Magic-Sand's exact API
          # (ScrollView::get(int), 3-arg ScrollViewEvent, setOptions).
          clone_pin thomwolf/ofxDatGui        ofxDatGui    0c2230afa68fe5dea822932f6b4c178778af9440
          # OF 0.12 removed `using namespace std;` from its headers; ofxDatGui
          # (0.9-era) relies on it via unqualified string/vector/shared_ptr in its
          # OWN headers. Re-introduce it per addon header so it compiles on OF 0.12.
          find ofxDatGui/src -name '*.h' -print0 \
            | xargs -0 sed -i 's/#pragma once/#pragma once\nusing namespace std;/'
          # ofxDatGui renders labels via ofTrueTypeFont::drawString. In OF's
          # programmable renderer both ttf and bitmap text funnel through
          # draw(const ofMesh&), which uploads to ONE shared renderer member VBO
          # (meshVbo) per call. In this app's multi-window shared-GL-context setup
          # under the forced GL 4.3 profile, many text draws per frame alias against
          # that single meshVbo - every draw reads the last upload, so labels render
          # as the wrong string / sheared garbage. Drawing through an ofVboMesh,
          # which owns its OWN vbo (draw(const ofVboMesh&) uses mesh.getVbo()),
          # sidesteps the shared meshVbo and renders each label correctly. We bind
          # the font texture exactly as OF's own ttf path does, so colour/alpha and
          # the nice TTF font are preserved. NOTE: call draw(OF_MESH_FILL) on the
          # ofVboMesh explicitly - the no-arg draw() slices back to the ofMesh path.
          sed -i 's|#include "ofxSmartFont.h"|#include "ofxSmartFont.h"\n#include "ofVboMesh.h"|' ofxDatGui/src/libs/ofxSmartFont/ofxSmartFont.cpp
          sed -i 's/ttf.drawString(s, x, y);/ofVboMesh _m = ttf.getStringMesh(s, x, y); const ofTexture\& _t = ttf.getFontTexture(); _t.bind(); _m.draw(OF_MESH_FILL); _t.unbind();/' ofxDatGui/src/libs/ofxSmartFont/ofxSmartFont.cpp
          # Fail loudly if a future ofxDatGui pin bump makes the substitution a
          # no-op (the panels would silently regress to garbled text otherwise).
          grep -q 'ofVboMesh _m = ttf.getStringMesh' ofxDatGui/src/libs/ofxSmartFont/ofxSmartFont.cpp \
            || { echo "ERROR: ofxSmartFont ofVboMesh patch did not apply"; exit 1; }
          # Route ofxSmartFont loads through the app's localization hook
          # (src/Localization) so GUI and modal fonts get Japanese glyphs.
          # Same patch as scripts/setup-mac.sh.
          sed -i 's|^class ofxSmartFont {|ofTrueTypeFontSettings ofxSmartFontSettings(const std::string\& file, int size);\n\nclass ofxSmartFont {|' ofxDatGui/src/libs/ofxSmartFont/ofxSmartFont.h
          sed -i 's/ttf\.load(mFile, mSize)/ttf.load(ofxSmartFontSettings(mFile, mSize))/' ofxDatGui/src/libs/ofxSmartFont/ofxSmartFont.h
          grep -q 'ttf.load(ofxSmartFontSettings(mFile, mSize))' ofxDatGui/src/libs/ofxSmartFont/ofxSmartFont.h \
            || { echo "ERROR: ofxSmartFont i18n patch did not apply"; exit 1; }

      - name: Configure Kinect SDK (vendored headers + import lib)
        shell: pwsh
        run: |
          # ofxKinectForWindows2 only needs the SDK *headers* (inc\Kinect.h) and the
          # x64 import lib (Lib\x64\Kinect20.lib) to compile and link; both are resolved
          # via the KINECTSDK20_DIR env var (the addon uses the $(KINECTSDK20_DIR)inc and
          # $(KINECTSDK20_DIR)Lib\x64\Kinect20.lib forms).
          #
          # We do NOT run the full KinectSDK-v2.0_1409-Setup.exe: it HANGS indefinitely
          # on headless CI runners (it installs the USB driver + KinectMonitor service,
          # which never completes without an interactive desktop), and the bundle cannot
          # be cleanly unpacked to its MSIs by 7-Zip (the product MSIs live in a second
          # attached container 7-Zip does not extract). Instead the ~0.6 MB of headers +
          # the 5 KB import lib are vendored in-repo (see third_party/KinectSDK-v2.0_1409/
          # README.md). This makes the build fast and deterministic. The 280 MB runtime
          # is only needed on the END USER's machine (for Kinect20.dll + the USB driver).
          $ErrorActionPreference = 'Stop'
          $sdk = (Resolve-Path "project\third_party\KinectSDK-v2.0_1409").Path.TrimEnd('\') + '\'
          if (-not (Test-Path (Join-Path $sdk 'inc\Kinect.h')))        { Write-Error "vendored Kinect.h missing under $sdk"; exit 1 }
          if (-not (Test-Path (Join-Path $sdk 'Lib\x64\Kinect20.lib'))) { Write-Error "vendored Kinect20.lib missing under $sdk"; exit 1 }
          "KINECTSDK20_DIR=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The addon links $(KINECTSDK20_DIR)Lib\$(PlatformTarget)\Kinect20.lib.
          # $(PlatformTarget) is a .NET property and is EMPTY in a projectGenerator-made
          # native OF vcxproj, which collapses the lib dir to ...\Lib\ and fails to find
          # Kinect20.lib (it lives in Lib\x64). Export PlatformTarget=x64 so the intended
          # ...\Lib\x64 path resolves. (A copy of the lib is also vendored at Lib\ root as
          # a belt-and-suspenders fallback for the empty-PlatformTarget case.)
          "PlatformTarget=x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "KINECTSDK20_DIR=$sdk"

      - name: Place project in OF tree
        shell: bash
        run: |
          mkdir -p openFrameworks/apps/myApps
          # CRITICAL: the openFrameworks tree is restored from a static cache
          # (key of-<ver>-win-vs) that is saved only once, on the first run. That
          # cache captured the first run's Magic-Sand app folder (its src + obj).
          # If we don't remove it, `cp -r project Magic-Sand` would NEST the fresh
          # checkout at Magic-Sand/project/ (because Magic-Sand already exists),
          # and the build would compile the STALE first-run sources instead of the
          # current checkout. Wipe it so the current source always wins.
          rm -rf openFrameworks/apps/myApps/Magic-Sand
          cp -r project openFrameworks/apps/myApps/Magic-Sand
          # Defensive: drop any committed IDE project files so projectGenerator
          # always builds a clean OF 0.12 one (correct OpenCV 4.x / libusb-1.0 /
          # freenect wiring). The repo no longer ships these, but guard anyway.
          rm -f openFrameworks/apps/myApps/Magic-Sand/Magic-Sand.sln \
                openFrameworks/apps/myApps/Magic-Sand/Magic-Sand.vcxproj \
                openFrameworks/apps/myApps/Magic-Sand/Magic-Sand.vcxproj.filters
          # Enable the Kinect v2 backend for the Windows build only (Linux/macOS
          # keep building V1 from the committed addons.make). projectGenerator
          # reads this to wire ofxKinectForWindows2's $(KINECTSDK20_DIR) include/lib.
          echo "ofxKinectForWindows2" >> openFrameworks/apps/myApps/Magic-Sand/addons.make

      - name: Regenerate VS project for OF 0.12
        shell: pwsh
        run: |
          $of = (Resolve-Path openFrameworks).Path
          $app = Join-Path $of "apps\myApps\Magic-Sand"
          $cands = Get-ChildItem -Path $of -Recurse -Filter projectGenerator.exe -ErrorAction SilentlyContinue
          Write-Host "projectGenerator.exe candidates:"; $cands | ForEach-Object { Write-Host "  $($_.FullName)" }
          # Pick the headless commandline binary (…\resources\app\app\projectGenerator.exe),
          # NOT the Electron GUI launcher (…\projectGenerator\projectGenerator.exe) which would hang.
          $pg = $cands | Where-Object { $_.FullName -match 'resources[\\/]app[\\/]app' } | Select-Object -First 1
          if (-not $pg) { $pg = $cands | Where-Object { $_.FullName -match 'resources' } | Select-Object -First 1 }
          if (-not $pg) { Write-Error "headless projectGenerator.exe not found in the OF release"; exit 1 }
          Write-Host "Using projectGenerator: $($pg.FullName)"
          # PG uses the Lean Mean C++ Option Parser: long options need the GNU
          # "--key=value" form (a leading "/" or a space-separated value is parsed
          # as the positional project path instead). The VS platform token is "vs".
          & $pg.FullName "--ofPath=$of" "--platforms=vs" "$app" 2>&1 | Write-Host
          Write-Host "projectGenerator exit code: $LASTEXITCODE"
          $vcx = Join-Path $app "Magic-Sand.vcxproj"
          if (-not (Test-Path $vcx)) {
            Write-Error "projectGenerator did not produce Magic-Sand.vcxproj"
            Get-ChildItem $app
            exit 1
          }
          # Re-inject the one def PG can't know about: dlib needs std::binary_function
          # (_HAS_AUTO_PTR_ETC) under C++17. Do NOT define _WINSOCKAPI_ project-wide —
          # it would guard winsock out of ofxKinect's libfreenect/core.c (undefined
          # 'struct timeval'). The winsock 1/2 conflict is instead handled per-file:
          # Bridge.cpp includes <winsock2.h> first and Bridge.h is socket-header-free.
          $raw = Get-Content $vcx -Raw
          # _HAS_STD_BYTE=0: the Kinect v2 COM headers (objidl.h/rpcndr.h via
          # windows.h) declare a global 'byte' that is ambiguous with C++17
          # std::byte (C2872) in the addon's own translation units. Disable
          # std::byte project-wide on Windows to resolve it everywhere.
          $raw = $raw -replace '<PreprocessorDefinitions>', '<PreprocessorDefinitions>_HAS_AUTO_PTR_ETC=1;_HAS_STD_BYTE=0;DUNEBOX_USE_KINECT_FOR_WINDOWS2;'
          # The addon links Kinect20.lib via $(KINECTSDK20_DIR)Lib\$(PlatformTarget)\Kinect20.lib.
          # In a projectGenerator-made NATIVE OF vcxproj that resolves badly ($(PlatformTarget)
          # is a .NET property and is empty here, and PG does not add the SDK lib dir to the
          # linker search path), so link.exe only sees a bare 'Kinect20.lib' and fails with
          # LNK1181. Rewrite the dependency to the ABSOLUTE vendored import lib so the linker
          # opens it directly, independent of any library-directory resolution.
          $kinectLib = (Resolve-Path "project\third_party\KinectSDK-v2.0_1409\Lib\x64\Kinect20.lib").Path
          Write-Host "Kinect20.lib absolute path: $kinectLib"
          Write-Host "--- vcxproj lib references BEFORE patch ---"
          ($raw -split "`r?`n") | Select-String -Pattern 'Kinect20|AdditionalDependencies|AdditionalLibraryDirectories' | ForEach-Object { Write-Host ("  " + $_.Line.Trim()) }
          $raw = $raw.Replace('Kinect20.lib', $kinectLib)
          # The OF VS template hardcodes /OPT:REF + /OPT:ICF (<OptimizeReferences>true</...>
          # + <EnableCOMDATFolding>true</...>) in Release. That dead-code elimination strips
          # the ofxKinectForWindows2 Device code (and with it the Kinect20.dll import), leaving
          # a v1-only binary even though the v2 path compiles. Disable both so the addon's
          # Device::open() -> GetDefaultKinectSensor reference is retained and Kinect v2 works.
          $raw = $raw -replace '<OptimizeReferences>true</OptimizeReferences>', '<OptimizeReferences>false</OptimizeReferences>'
          $raw = $raw -replace '<EnableCOMDATFolding>true</EnableCOMDATFolding>', '<EnableCOMDATFolding>false</EnableCOMDATFolding>'
          # /OPT:NOREF is incompatible with /LTCG:incremental (LNK1295). The OF template
          # enables incremental LTCG; turn LTCG off (and whole-program opt) so NOREF links.
          $raw = $raw -replace '<LinkTimeCodeGeneration>.*?</LinkTimeCodeGeneration>', '<LinkTimeCodeGeneration>Default</LinkTimeCodeGeneration>'
          $raw = $raw -replace '<WholeProgramOptimization>true</WholeProgramOptimization>', '<WholeProgramOptimization>false</WholeProgramOptimization>'
          Set-Content $vcx $raw
          Write-Host "=== DIAG: PreprocessorDefinitions lines in generated vcxproj ==="
          (Get-Content $vcx) | Select-String -Pattern 'PreprocessorDefinitions' | ForEach-Object { Write-Host ("  " + $_.Line.Trim()) }
          Write-Host "=== DIAG: configs (ItemDefinitionGroup Condition) ==="
          (Get-Content $vcx) | Select-String -Pattern 'ItemDefinitionGroup Condition' | ForEach-Object { Write-Host ("  " + $_.Line.Trim()) }
          Write-Host "=== DIAG: does vcxproj reference the addon sources? ==="
          (Get-Content $vcx) | Select-String -Pattern 'ofxKinectForWindows2' | Select-Object -First 6 | ForEach-Object { Write-Host ("  " + $_.Line.Trim()) }
          Write-Host "=== DIAG: KinectGrabber.cpp ClCompile entry (per-file overrides?) ==="
          (Get-Content $vcx) | Select-String -Pattern 'KinectGrabber.cpp' | ForEach-Object { Write-Host ("  " + $_.Line.Trim()) }
          Write-Host "=== DIAG: linker OPT settings (must be false) ==="
          (Get-Content $vcx) | Select-String -Pattern 'OptimizeReferences|EnableCOMDATFolding|LinkTimeCodeGeneration|WholeProgramOptimization' | ForEach-Object { Write-Host ("  " + $_.Line.Trim()) }
          if (-not (Select-String -Path $vcx -Pattern ([regex]::Escape($kinectLib)) -Quiet)) {
            Write-Error "Failed to wire absolute Kinect20.lib path into Magic-Sand.vcxproj"; exit 1
          }
          if (-not (Select-String -Path $vcx -Pattern '_HAS_AUTO_PTR_ETC=1' -Quiet)) {
            Write-Error "Failed to inject preprocessor defs into Magic-Sand.vcxproj"; exit 1
          }
          if (-not (Select-String -Path $vcx -Pattern 'DUNEBOX_USE_KINECT_FOR_WINDOWS2' -Quiet)) {
            Write-Error "Failed to inject DUNEBOX_USE_KINECT_FOR_WINDOWS2 into Magic-Sand.vcxproj"; exit 1
          }
          if (Select-String -Path $vcx -Pattern '_WINSOCKAPI_' -Quiet) {
            Write-Error "_WINSOCKAPI_ leaked into Magic-Sand.vcxproj — would break libfreenect/core.c"; exit 1
          }
          Write-Host "Re-injected _HAS_AUTO_PTR_ETC + DUNEBOX_USE_KINECT_FOR_WINDOWS2 into Magic-Sand.vcxproj"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build x64 Release
        shell: cmd
        run: |
          cd openFrameworks\apps\myApps\Magic-Sand
          rem Delete cached app/addon object files so EVERY source recompiles with the
          rem injected DUNEBOX_USE_KINECT_FOR_WINDOWS2 define. The OF core lib is cached
          rem separately (openFrameworksCompiled) and is NOT affected by this.
          if exist obj rmdir /s /q obj
          if exist bin\Magic-Sand.exe del /q bin\Magic-Sand.exe
          msbuild Magic-Sand.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m

      - name: Package release
        shell: powershell
        run: |
          $binDir = "openFrameworks\apps\myApps\Magic-Sand\bin"
          
          # Copy OF shared libs needed at runtime
          $ofBinDir = "openFrameworks\libs\openFrameworksCompiled\lib\vs\x64\Release"
          if (Test-Path $ofBinDir) {
            Get-ChildItem "$ofBinDir\*.dll" | Copy-Item -Destination $binDir
          }

          # Copy addon runtime DLLs (libusb for Kinect, OpenCV 4 for ofxCv/ofxOpenCv)
          foreach ($addon in @("ofxKinect","ofxOpenCv","ofxCv")) {
            $dlls = Get-ChildItem "openFrameworks\addons\$addon" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*x64*" }
            foreach ($dll in $dlls) {
              Copy-Item $dll.FullName -Destination $binDir -ErrorAction SilentlyContinue
            }
          }

          Write-Host "=== bin\ contents (verify exe + runtime DLLs present) ==="
          Get-ChildItem $binDir | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          if (-not (Test-Path "$binDir\Magic-Sand.exe")) {
            Write-Error "Build did not produce Magic-Sand.exe"; exit 1
          }

          # GUARD: verify the v2 path is actually compiled in. The exe MUST import
          # Kinect20.dll (via ofxKinectForWindows2 -> GetDefaultKinectSensor). If it
          # doesn't, the DUNEBOX_USE_KINECT_FOR_WINDOWS2 define did not reach the
          # KinectGrabber/addon objects (e.g. a stale cached obj) -> fail loudly so we
          # never ship a v1-only binary.
          # GUARD: verify the v2 path is actually compiled in. Two independent checks:
          #  (1) the exe must import Kinect20.dll (the ofxKinectForWindows2 addon ->
          #      GetDefaultKinectSensor), and
          #  (2) the exe must contain KinectGrabber.cpp's v2-branch log string, which
          #      only survives if the #ifdef DUNEBOX_USE_KINECT_FOR_WINDOWS2 block in
          #      OUR source actually compiled (the addon compiles unconditionally, so
          #      Kinect20.dll alone is NOT sufficient proof). If either is missing the
          #      v2 path was not compiled in -> fail loudly so we never ship a v1-only exe.
          $exeBytes = [System.IO.File]::ReadAllText("$binDir\Magic-Sand.exe", [System.Text.Encoding]::ASCII)
          $hasImport = $exeBytes -match 'Kinect20\.dll'
          $hasBranch = $exeBytes -match 'opening Kinect for Windows v2'
          Write-Host "GUARD: Kinect20.dll import = $hasImport ; v2-branch string = $hasBranch"
          if ($hasImport -and $hasBranch) {
            Write-Host "OK: Magic-Sand.exe imports Kinect20.dll AND contains the KinectGrabber v2 branch (Kinect v2 path compiled in)"
          } else {
            Write-Error "Kinect v2 path NOT fully compiled in (import=$hasImport branch=$hasBranch). DUNEBOX_USE_KINECT_FOR_WINDOWS2 did not take effect. Failing."
            exit 1
          }

          # Create zip
          Compress-Archive -Path "$binDir\*" -DestinationPath "DuneBox-windows-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DuneBox-windows-x64
          path: DuneBox-windows-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: DuneBox-windows-x64.zip
          generate_release_notes: true
